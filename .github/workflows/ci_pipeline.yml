name: Python CI Pipeline - Sistem Perpustakaan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Menambahkan layanan MySQL agar server GitHub Actions menyediakan database saat testing
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_DATABASE: "perpustakaan"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 1. Mengambil Kode dari Repositori (Checkout)
        uses: actions/checkout@v4

      - name: 2. Menyiapkan Lingkungan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Menginstal Dependensi Proyek
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Menjalankan Automated Unit Testing (Pytest)
        run: |
          python -m pytest -v
